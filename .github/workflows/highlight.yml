name: Refresh Highlights

on:
  workflow_dispatch:
  schedule:
    # ICT 03:37 through 09:07, every 30 minutes.
    - cron: "37 20 * * *"
    - cron: "7,37 21-23,0,1 * * *"
    - cron: "7 2 * * *"
    # Catch-up at 10:37 and 12:37 ICT, moved out of update.yml.
    - cron: "37 3,5 * * *"

concurrency:
  group: playlist-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Refresh highlight playlist
        timeout-minutes: 14
        run: |
          RUN_MODE=highlight python combined_m3u_collector.py
          test -s highlight.m3u
          test -s all.m3u
          test -s ott.m3u
          ls -lh highlight.m3u all.m3u ott.m3u

      - name: Publish generated files
        run: python scripts/publish_playlists.py --message "Refresh highlight playlists" highlight.m3u all.m3u ott.m3u dasfootball.m3u dasfootball_order.json h24_highlight_cache.json

      - name: Preserve results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-publication-highlight-${{ github.run_id }}
          retention-days: 7
          path: |
            *.m3u
            *_cache.json
            slow_sources_archive.json
            dasfootball_order.json
            publish-failed.patch
