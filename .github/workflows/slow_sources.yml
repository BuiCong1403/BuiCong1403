name: Refresh Slow Sports Sources

on:
  workflow_dispatch:
  schedule:
    # Asia/Bangkok: run 30 minutes before the main live-playlist updates.
    - cron: "30 18 * * *"
    - cron: "30 1 * * *"
    - cron: "30 4 * * *"
    - cron: "30 6 * * *"
    - cron: "30 8 * * *"
    - cron: "30 10 * * *"

concurrency:
  group: refresh-slow-sports-sources
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Refresh slow source playlist
        timeout-minutes: 14
        run: |
          RUN_MODE=slow python combined_m3u_collector.py
          test -s slow_sources.m3u
          ls -lh slow_sources.m3u

      - name: Commit slow source playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add slow_sources.m3u
          if git diff --cached --quiet; then
            echo "No slow-source changes to commit."
            exit 0
          fi
          git commit -m "Refresh slow sports sources"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin main
          done
          git push
