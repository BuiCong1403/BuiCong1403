name: Refresh Slow Sports Sources

on:
  workflow_dispatch:
  schedule:
    # ICT 01:43, 08:43, 11:43, 13:43, 15:43, 17:43.
    - cron: "43 18 * * *"
    - cron: "43 1 * * *"
    - cron: "43 4 * * *"
    - cron: "43 6 * * *"
    - cron: "43 8 * * *"
    - cron: "43 10 * * *"

concurrency:
  group: playlist-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Refresh slow source playlist
        timeout-minutes: 14
        run: |
          RUN_MODE=slow python combined_m3u_collector.py
          test -s slow_sources.m3u
          test -s slow_sources_archive.json
          ls -lh slow_sources.m3u slow_sources_archive.json

      - name: Publish generated files
        run: python scripts/publish_playlists.py --message "Refresh slow_sources and merged playlists" slow_sources.m3u slow_sources_archive.json khandaia_cache.json all.m3u ott.m3u

      - name: Preserve results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-publication-slow_sources-${{ github.run_id }}
          retention-days: 7
          path: |
            *.m3u
            *_cache.json
            slow_sources_archive.json
            dasfootball_order.json
            publish-failed.patch
