name: Update M3U

on:
  workflow_dispatch:
  schedule:
    # Live sports, Asia/Bangkok: 02:00, 16:00, 18:00
    - cron: "0 19 * * *"
    - cron: "0 9 * * *"
    - cron: "0 11 * * *"
    # Highlights, Asia/Bangkok: every 30 minutes from 03:30 to 07:30
    - cron: "30 20 * * *"
    - cron: "0 21 * * *"
    - cron: "30 21 * * *"
    - cron: "0 22 * * *"
    - cron: "30 22 * * *"
    - cron: "0 23 * * *"
    - cron: "30 23 * * *"
    - cron: "0 0 * * *"
    - cron: "30 0 * * *"

concurrency:
  group: update-m3u-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Generate M3U files
        run: |
          RUN_MODE="all"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "30 20 * * *"|"0 21 * * *"|"30 21 * * *"|"0 22 * * *"|"30 22 * * *"|"0 23 * * *"|"30 23 * * *"|"0 0 * * *"|"30 0 * * *")
                RUN_MODE="highlight"
                ;;
              *)
                RUN_MODE="live"
                ;;
            esac
          fi
          echo "RUN_MODE=$RUN_MODE"
          RUN_MODE="$RUN_MODE" python combined_m3u_collector.py
          rm -f sport.m3u
          rm -f tinhlagi.m3u thethaocoban.m3u
          rm -f export_reference_m3u.bat
          test -f all.m3u
          test -s all.m3u
          test -f ott.m3u
          test -s ott.m3u
          test -f highlight.m3u
          test -s highlight.m3u
          ls -lh all.m3u ott.m3u highlight.m3u

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update m3u files"
            for i in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push failed, rebasing on latest origin/main and retrying..."
              git pull --rebase origin main
            done
            git push
          fi
