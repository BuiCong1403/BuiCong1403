name: Update M3U

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "combined_m3u_collector.py"
      - "footonsat_collector.py"
      - "fancode_m3u_export.py"
      - ".github/workflows/update.yml"
      - "scripts/publish_playlists.py"
  schedule:
    # ICT 02:17, 06:17, 07:17, 09:17, 12:17, 14:17, 16:17, 18:17.
    # Highlight scraping belongs exclusively to highlight.yml.
    - cron: "17 19,23,0,2,5,7,9,11 * * *"

concurrency:
  group: playlist-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Generate M3U files
        timeout-minutes: 30
        run: |
          RUN_MODE=live python combined_m3u_collector.py
          python footonsat_collector.py
          python fancode_m3u_export.py
          rm -f sport.m3u
          rm -f tinhlagi.m3u thethaocoban.m3u
          rm -f export_reference_m3u.bat
          test -f all.m3u
          test -s all.m3u
          test -f ott.m3u
          test -s ott.m3u
          test -f highlight.m3u
          test -s highlight.m3u
          test -f footonsat.m3u
          test -s footonsat.m3u
          rm -f tinhlagi_app.m3u
          test -f fancode.m3u
          test -s fancode.m3u
          test -f slow_sources.m3u
          test -s slow_sources.m3u
          test -f slow_sources_archive.json
          test -s slow_sources_archive.json
          ls -lh all.m3u ott.m3u highlight.m3u fancode.m3u footonsat.m3u slow_sources.m3u slow_sources_archive.json

      - name: Publish generated files
        run: python scripts/publish_playlists.py --message "Refresh update playlists" all.m3u ott.m3u highlight.m3u footonsat.m3u fancode.m3u slow_sources.m3u slow_sources_archive.json dasfootball_order.json "*_cache.json"

      - name: Preserve results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-publication-update-${{ github.run_id }}
          retention-days: 7
          path: |
            *.m3u
            *_cache.json
            slow_sources_archive.json
            dasfootball_order.json
            publish-failed.patch
