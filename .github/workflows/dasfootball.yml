name: Merge DasFootball Local Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dasfootball.m3u"
      - "dasfootball_order.json"
      - ".github/workflows/dasfootball.yml"

concurrency:
  group: playlist-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Merge uploaded DasFootball snapshot
        run: RUN_MODE=merge_dasfootball python -u combined_m3u_collector.py
      - name: Publish generated files
        run: python scripts/publish_playlists.py --message "Refresh dasfootball playlists" highlight.m3u all.m3u ott.m3u

      - name: Preserve results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-publication-dasfootball-${{ github.run_id }}
          retention-days: 7
          path: |
            *.m3u
            *_cache.json
            slow_sources_archive.json
            dasfootball_order.json
            publish-failed.patch
