name: Refresh DasFootball

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "combined_m3u_collector.py"
      - ".github/workflows/dasfootball.yml"
  schedule:
    # Vietnam 06:00-12:30, every 30 minutes.
    - cron: "0,30 23,0-5 * * *"

concurrency:
  group: refresh-dasfootball
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    # Set this repository variable to a private runner label when available.
    runs-on: ${{ vars.DASFOOTBALL_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install requests
      - name: Verify DasFootball access before collection
        shell: python
        run: |
          import os
          import requests
          from pathlib import Path
          url = "https://dasfootball.com/"
          response = requests.get(url, headers={"User-Agent": "Mozilla/5.0"}, timeout=30)
          if response.status_code == 403:
              message = (
                  "DasFootball refused this GitHub runner with HTTP 403. "
                  "Retries and longer timeouts cannot refresh videos while access is refused. "
                  "Existing playlists were not modified. Use an authorized private/cloud runner "
                  "and set the DASFOOTBALL_RUNNER repository variable to its label, "
                  "or ask the website to allow GitHub Actions traffic."
              )
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with Path(summary).open("a", encoding="utf-8") as output:
                      output.write("## DasFootball access blocked\n\n" + message + "\n")
              print("::error::" + message)
              raise SystemExit(1)
          response.raise_for_status()
      - name: Collect and merge DasFootball
        run: |
          for attempt in 1 2 3; do
            RUN_MODE=dasfootball python -u combined_m3u_collector.py && exit 0
            echo "::warning::DasFootball attempt $attempt failed; previous playlists are preserved."
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          exit 1
      - name: Publish playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dasfootball.m3u dasfootball_order.json h24_highlight_cache.json highlight.m3u all.m3u ott.m3u
          git diff --cached --quiet && exit 0
          git commit -m "Refresh DasFootball highlights"
          for attempt in 1 2 3; do
            git push && exit 0
            git fetch origin main
            git rebase origin/main || {
              for path in $(git diff --name-only --diff-filter=U); do
                case "$path" in
                  dasfootball.m3u|dasfootball_order.json|h24_highlight_cache.json) git checkout --theirs -- "$path" ;;
                  all.m3u|ott.m3u|highlight.m3u) git checkout --ours -- "$path" ;;
                  *) git rebase --abort; exit 1 ;;
                esac
              done
              RUN_MODE=merge_dasfootball python combined_m3u_collector.py
              git add dasfootball.m3u dasfootball_order.json h24_highlight_cache.json highlight.m3u all.m3u ott.m3u
              GIT_EDITOR=true git rebase --continue
            }
          done
          exit 1
