name: Diagnose DasFootball access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check public pages
        shell: python
        run: |
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          import sys
          success = False
          for url in ("https://dasfootball.com/", "https://dasfootball.com/juventus-vs-lazio-highlights-2026-10-18/"):
              try:
                  request = Request(url, headers={"User-Agent": "Mozilla/5.0", "Accept": "text/html"})
                  with urlopen(request, timeout=25) as response:
                      text = response.read().decode("utf-8", errors="replace")
                      print(url, response.status, len(text), text[:120])
                      success = success or (response.status == 200 and "highlights" in text.lower())
              except Exception as exc:
                  print(url, type(exc).__name__, str(exc))
          sys.exit(0 if success else 1)
