name: Refresh Vua San Co
on:
  workflow_dispatch:
  schedule:
    - cron: "20 */2 * * *"
permissions:
  contents: write
concurrency:
  group: playlist-main
  cancel-in-progress: false
  queue: max
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install requests
      - name: Collect current Vua San Co streams
        run: |
          for attempt in 1 2 3; do
            RUN_MODE=vsc9 python -u combined_m3u_collector.py && exit 0
            echo "::warning::VSC9 attempt $attempt failed; no empty playlist will be published."
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          exit 1
      - name: Publish generated files
        run: python scripts/publish_playlists.py --message "Refresh vsc9 playlists" vsc9.m3u vsc9_cache.json all.m3u ott.m3u

      - name: Preserve results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-publication-vsc9-${{ github.run_id }}
          retention-days: 7
          path: |
            *.m3u
            *_cache.json
            slow_sources_archive.json
            dasfootball_order.json
            publish-failed.patch
