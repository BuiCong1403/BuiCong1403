name: Refresh Tra Da and Nem Bien

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes, avoiding minute zero. ICT uses the same minutes.
    - cron: "7,37 * * * *"

concurrency:
  group: playlist-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Refresh only Tra Da and Nem Bien and merge
        timeout-minutes: 8
        run: python refresh_trada_nembien.py
      - name: Publish generated files
        run: python scripts/publish_playlists.py --message "Refresh Tra Da, Nem Bien and AntLive streams" all.m3u ott.m3u tradatv_cache.json nembientv_cache.json antlive_cache.json
      - name: Preserve results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-publication-trada-nembien-${{ github.run_id }}
          retention-days: 7
          path: |
            all.m3u
            ott.m3u
            tradatv_cache.json
            nembientv_cache.json
            publish-failed.patch
