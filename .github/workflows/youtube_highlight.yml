name: Refresh YouTube Sports Highlights
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "youtube_highlight_collector.py"
      - ".github/workflows/youtube_highlight.yml"
  schedule:
    # Morning refresh and a catch-up for videos published later: 08:15, 10:15 ICT.
    - cron: "15 1,3 * * *"
permissions:
  contents: write
concurrency:
  group: playlist-main
  cancel-in-progress: false
  queue: max
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Discover and validate new sports videos
        run: python -u youtube_highlight_collector.py
      - name: Merge into highlight and main playlists
        run: RUN_MODE=merge_youtube python -u combined_m3u_collector.py
      - name: Publish generated files
        run: python scripts/publish_playlists.py --message "Refresh youtube_highlight playlists" youtube_highlight_cache.json h24_highlight_cache.json highlight.m3u all.m3u ott.m3u

      - name: Preserve results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-publication-youtube_highlight-${{ github.run_id }}
          retention-days: 7
          path: |
            *.m3u
            *_cache.json
            slow_sources_archive.json
            dasfootball_order.json
            publish-failed.patch
