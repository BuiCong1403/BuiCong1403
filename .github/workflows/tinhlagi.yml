name: Refresh Tinhlagi Reference

on:
  workflow_dispatch:
  # Manual only: upstream DNS is unavailable. Do not queue automatic retries.

concurrency:
  group: playlist-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Export reference playlists
        env:
          TINHLAGI_APP_ACTIVATION_CODE: ${{ secrets.TINHLAGI_APP_ACTIVATION_CODE || 'tinhlagipro' }}
        run: python tinhlagi_app_export.py
      - name: Publish generated files
        run: python scripts/publish_playlists.py --message "Refresh tinhlagi playlists" tlgapp.m3u hl.m3u

      - name: Preserve results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-publication-tinhlagi-${{ github.run_id }}
          retention-days: 7
          path: |
            *.m3u
            *_cache.json
            slow_sources_archive.json
            dasfootball_order.json
            publish-failed.patch
